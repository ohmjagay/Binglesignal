name: Checks

# Runs when code changes (not when the robot saves new feed files).
on:
  push:
    paths:
      - 'public/**/*.js'
      - 'public/**/*.json'
      - 'public/**/*.html'
      - 'scripts/**'
      - 'worker/**'
      - 'supabase/**'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static data files are valid JSON (catches Git merge-conflict markers)
        run: node -e "for (const f of ['public/feed.json']) { JSON.parse(require('fs').readFileSync(f, 'utf8')); console.log('valid JSON:', f); }"
      - name: JavaScript has no syntax errors
        run: |
          for f in public/*.js scripts/*.mjs worker/src/*.js; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done
      - name: All automated tests
        run: npm test
