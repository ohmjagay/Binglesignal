name: Refresh briefing

# Rebuilds the news feed (public/feed.json + public/pool.json):
#   - automatically every 6 hours
#   - whenever you change scripts/ or public/taxonomy.js
#   - whenever you press "Run workflow" on the GitHub Actions tab
# IMPORTANT: this file MUST live at  .github/workflows/refresh-briefing.yml
# (inside a folder called "workflows"). GitHub ignores it anywhere else.

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'public/taxonomy.js'

permissions:
  contents: write

concurrency:
  group: refresh-briefing
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the feed (reads about 285 sources)
        run: node scripts/ingest.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Save the new feed to the repo
        run: |
          git config user.name "BingleSignal Bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/feed.json public/pool.json
          if git diff --cached --quiet; then
            echo "Feed unchanged - nothing to save."
            exit 0
          fi
          git commit -m "Refresh briefing"
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Save attempt $i failed - retrying in 5 seconds"
            sleep 5
          done
          exit 1
