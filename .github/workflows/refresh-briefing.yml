name: Refresh briefing

# Rebuilds a small public teaser and publishes the full story pool to Supabase:
#   - automatically every 6 hours
#   - whenever you change scripts/ or public/taxonomy.js
#   - whenever you press "Run workflow" on the GitHub Actions tab
# IMPORTANT: this file MUST live at  .github/workflows/refresh-briefing.yml
# (inside a folder called "workflows"). GitHub ignores it anywhere else.

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'public/taxonomy.js'

permissions:
  contents: read

concurrency:
  group: refresh-briefing
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ingest, summarize, and publish briefing stories
        run: node scripts/ingest.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL_AI_PROVIDER: ${{ secrets.EMAIL_AI_PROVIDER }}
          EMAIL_AI_ENDPOINT: ${{ secrets.EMAIL_AI_ENDPOINT }}
          EMAIL_AI_API_KEY: ${{ secrets.EMAIL_AI_API_KEY }}
          EMAIL_AI_MODEL: ${{ secrets.EMAIL_AI_MODEL }}
