name: Refresh briefing

# Publishes the full story pool (with DeepSeek summaries) to Supabase, automatically every 6 hours (and on demand: Actions -> Refresh briefing -> Run workflow).
# If this stops running, the briefing goes stale: the site keeps showing old stories. The Site health workflow checks for that too.
# IMPORTANT: this file MUST live at  .github/workflows/refresh-briefing.yml
# (inside a folder called "workflows"). GitHub ignores it anywhere else.

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-briefing
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ingest, summarize, and publish briefing stories
        run: node scripts/ingest.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          # Optional spending brakes. Leave unset for the defaults (500 summaries per run, 120 from full article text).
          # To spend less: repo -> Settings -> Secrets and variables -> Actions -> Variables -> New repository variable.
          MAX_NEW_NOTES: ${{ vars.MAX_NEW_NOTES }}
          DEEP_SUMMARY_TOP: ${{ vars.DEEP_SUMMARY_TOP }}
