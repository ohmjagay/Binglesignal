# Site (everything in /public) + payments API (/api/* handled by worker/src/index.js) in ONE deploy.
name = "binglesignal"
main = "worker/src/index.js"
compatibility_date = "2025-10-01"
# Keep variables you typed in the Cloudflare dashboard when this file is deployed. Without this line a deploy can silently
# delete dashboard variables (not Secrets) such as SUPABASE_URL, and READ/WATCH then fail with "server error".
keep_vars = true

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[triggers]
# JOB_CRON = '* * * * *' in worker/src/email-beta.js drives email job processing; keep this trigger aligned.
# The email beta is paused with EMAIL_BETA_ENABLED=false, which turns the email jobs on these triggers into instant no-ops.
# Only the */15 trigger does real work today: it composes due daily editions and runs lifecycle jobs.
crons = ["0 */6 * * *", "* * * * *", "*/15 * * * *"]

[[durable_objects.bindings]]
name = "EMAIL_AI_BUDGET"
class_name = "EmailAiBudget"

[[durable_objects.bindings]]
name = "API_RATE_LIMITS"
class_name = "ApiRateLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EmailAiBudget"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ApiRateLimits"]

[observability]
enabled = true

# Add every value as a *Secret* in Cloudflare (Workers & Pages -> binglesignal -> Settings -> Variables and Secrets).
# Leave them empty until you have them: the pricing page then shows "Payments opening soon" and nothing breaks.
# Full list with what each one is: .dev.vars.example
