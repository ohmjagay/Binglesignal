# Site (everything in /public) + payments API (/api/* handled by worker/src/index.js) in ONE deploy.
name = "binglesignal"
main = "worker/src/index.js"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Add every value as a *Secret* in Cloudflare (Workers & Pages -> binglesignal -> Settings -> Variables and Secrets).
# Leave them empty until you have them: the pricing page then shows "Payments opening soon" and nothing breaks.
# Full list with what each one is: .dev.vars.example
